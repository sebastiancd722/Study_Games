<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StudyGrid - Gamified Learning</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Inter', sans-serif;
        background-color: #0f172a;
        color: #f8fafc;
        /* Rich mesh gradient background */
        background-image: 
          radial-gradient(at 0% 0%, hsla(253,16%,7%,1) 0, transparent 50%), 
          radial-gradient(at 50% 0%, hsla(225,39%,30%,1) 0, transparent 50%), 
          radial-gradient(at 100% 0%, hsla(339,49%,30%,1) 0, transparent 50%);
        background-attachment: fixed;
        min-height: 100vh;
      }
      
      .glass-panel {
        background: rgba(30, 41, 59, 0.7);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.1);
      }

      /* Animations */
      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
      }
      
      @keyframes modalEnter {
        from { opacity: 0; transform: scale(0.95) translateY(10px); }
        to { opacity: 1; transform: scale(1) translateY(0); }
      }

      @keyframes modalExit {
        from { opacity: 1; transform: scale(1) translateY(0); }
        to { opacity: 0; transform: scale(0.9) translateY(10px); }
      }

      @keyframes modalPop {
        0% { opacity: 0; transform: scale(0.8) translateY(20px); }
        50% { opacity: 1; transform: scale(1.03) translateY(-5px); }
        100% { opacity: 1; transform: scale(1) translateY(0); }
      }

      @keyframes popIn {
        0% { transform: scale(0.8); opacity: 0; }
        100% { transform: scale(1); opacity: 1; }
      }

      @keyframes cellClear {
        0% { transform: scale(1); opacity: 1; filter: brightness(1); }
        40% { transform: scale(1.1); opacity: 1; filter: brightness(1.2); }
        100% { transform: scale(0.9); opacity: 0.4; filter: grayscale(1) brightness(0.8); }
      }

      .animate-fade-in {
        animation: fadeIn 0.5s ease-out forwards;
      }
      
      .animate-fade-in-up {
        animation: fadeIn 0.4s ease-out forwards;
      }

      /* Staggered entry helper - applied via JS usually, but here's a base class */
      .animate-grid-entry {
        opacity: 0;
        animation: fadeIn 0.5s ease-out forwards;
      }

      .animate-modal-enter {
        animation: modalEnter 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }

      .animate-modal-pop {
        animation: modalPop 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
      }

      .animate-modal-exit {
        animation: modalExit 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }

      .animate-pop-in {
        animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
      }
      
      .animate-cell-clear {
        animation: cellClear 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
      }

      /* Custom Scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: rgba(30, 41, 59, 0.5); 
      }
      ::-webkit-scrollbar-thumb {
        background: #475569; 
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #64748b; 
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",

}
</script>
